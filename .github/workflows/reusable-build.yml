# Reusable workflow for building & pushing Docker images.
#
# Each driver passes a different JSON array of Alpine versions and decides
# whether the result should be pushed:
#   - PR / CI : ["3.24", "3.23", "latest", "3", "edge"]   push_image=false
#   - weekly  : ["3.24", "3.23", "latest", "3", "edge"]   push_image=true
#   - monthly : ["3.24", "3.23", "latest", "3", "edge"]   push_image=true
#
# The matrix platform list (linux/amd64, arm64, arm/v7, arm/v6) is
# the same for every build.
#
# Push is a *step* inside the single build job (not a separate job) so it
# runs in the checkout that fetched the repository. A separate job would
# run on a clean runner and fail with "Dockerfile not found".

name: Build & Push

on:
  workflow_call:
    inputs:
      alpine_versions:
        description: 'JSON array of Alpine versions to build'
        required: true
        type: string
      push_image:
        description: 'Push to Docker Hub (true=master push / cron; false=PR-only build)'
        required: false
        type: boolean
        default: false
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_PASS:
        required: true
    outputs:
      tagged_version:
        description: 'The final image tag'
        value: ${{ jobs.build.outputs.TAG }}

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_REPO: drpsychick
  DOCKER_IMAGE: dnsmasq

jobs:
  build:
    name: Build (Alpine ${{ matrix.alpine_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      TAG: ${{ steps.detect.outputs.tag }}

    strategy:
      fail-fast: false
      matrix:
        alpine_version: ${{ fromJSON(inputs.alpine_versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.37.1
          driver: docker-container

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build all platforms (cache only)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
            linux/arm/v7
            linux/arm/v6
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine_version }}
          push: false

      - name: Detect dnsmasq version
        id: detect
        run: |
          AV="${{ matrix.alpine_version }}"
          TAG="${AV}"

          if [[ "${AV}" != "latest" ]]; then
            docker build --platform linux/amd64 \
              --build-arg ALPINE_VERSION="${AV}" \
              --tag "${DOCKER_REGISTRY}/${DOCKER_REPO}/${DOCKER_IMAGE}:tmp" .

            RAW_VERSION=$(docker run --rm -t \
              "${DOCKER_REGISTRY}/${DOCKER_REPO}/${DOCKER_IMAGE}:tmp" \
              --version \
              | head -n1 \
              | sed -e 's/Dnsmasq version \([0-9.a-z]*\) *Copyright.*/\1/')

            TAG="${RAW_VERSION}"
          fi

          REF="${GITHUB_REF#refs/heads/}"
          if [[ "${REF}" != "master" ]]; then
            TAG="${TAG}-dev"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # ---- push (only when caller requests it, i.e. master push / cron) ----
      - name: Login to Docker Hub
        if: inputs.push_image
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Push image
        if: inputs.push_image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
            linux/arm/v7
            linux/arm/v6
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine_version }}
          push: true
          tags: "${DOCKER_REGISTRY}/${DOCKER_REPO}/${DOCKER_IMAGE}:${{ steps.detect.outputs.tag }}"
          cache-from: type=gha
