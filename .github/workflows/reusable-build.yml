# Reusable workflow for building & pushing Docker images.
#
# Each driver passes a different JSON array of Alpine versions:
#   - PR  : ["3.23", "latest", "3", "3.18", "3.19", "3.20", "edge"]
#   - weekly: ["3.23", "latest", "3", "edge"]
#   - monthly: ["3.23", "latest", "3", "3.18", "3.19", "3.20", "edge"]
#
# The matrix platform list (linux/amd64, arm64, arm/v7, arm/v6) is
# the same for every build.

name: Build & Push

on:
  workflow_call:
    inputs:
      alpine_versions:
        description: 'JSON array of Alpine versions to build'
        required: true
        type: string

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_REPO: drpsychick
  DOCKER_IMAGE: dnsmasq

jobs:
  build:
    name: Build (Alpine ${{ matrix.alpine_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        alpine_version: ${{ fromJSON(inputs.alpine_versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.36.1
          driver: docker-container

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build all platforms (cache only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
            linux/arm/v7
            linux/arm/v6
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine_version }}
          push: false

      - name: Detect dnsmasq version
        id: detect
        run: |
          AV="${{ matrix.alpine_version }}"
          TAG="${AV}"

          if [[ "${AV}" != "latest" ]]; then
            docker build --platform linux/amd64 \
              --build-arg ALPINE_VERSION="${AV}" \
              --tag "${DOCKER_REGISTRY}/${DOCKER_REPO}/${DOCKER_IMAGE}:tmp" .

            RAW_VERSION=$(docker run --rm -t \
              "${DOCKER_REGISTRY}/${DOCKER_REPO}/${DOCKER_IMAGE}:tmp" \
              --version \
              | head -n1 \
              | sed -e 's/Dnsmasq version \([0-9.a-z]*\) *Copyright.*/\1/')

            TAG="${RAW_VERSION}"
          fi

          REF="${GITHUB_REF#refs/heads/}"
          if [[ "${REF}" != "master" ]]; then
            TAG="${TAG}-dev"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  push:
    name: Push (Alpine ${{ matrix.alpine_version }})
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        alpine_version: ${{ fromJSON(inputs.alpine_versions) }}

    steps:
      - name: Detect final tag
        id: detect
        run: |
          AV="${{ matrix.alpine_version }}"
          TAG="${AV}"

          if [[ "${AV}" != "latest" ]]; then
            docker build --platform linux/amd64 \
              --build-arg ALPINE_VERSION="${AV}" \
              --tag "${DOCKER_REGISTRY}/${DOCKER_REPO}/${DOCKER_IMAGE}:tmp" .

            RAW_VERSION=$(docker run --rm -t \
              "${DOCKER_REGISTRY}/${DOCKER_REPO}/${DOCKER_IMAGE}:tmp" \
              --version \
              | head -n1 \
              | sed -e 's/Dnsmasq version \([0-9.a-z]*\) *Copyright.*/\1/')

            TAG="${RAW_VERSION}"
          fi

          REF="${GITHUB_REF#refs/heads/}"
          if [[ "${REF}" != "master" ]]; then
            TAG="${TAG}-dev"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Push
        run: |
          TAG="${{ steps.detect.outputs.tag }}"
          IMAGE="${DOCKER_REGISTRY}/${DOCKER_REPO}/${DOCKER_IMAGE}"

          docker buildx create --name builder --use
          docker buildx build --progress plain \
            --platform linux/amd64 \
            --platform linux/arm64 \
            --platform linux/arm/v7 \
            --platform linux/arm/v6 \
            --build-arg ALPINE_VERSION="${{ matrix.alpine_version }}" \
            --tag "${IMAGE}:${TAG}" \
            --push .

          echo "✓ Pushed ${IMAGE}:${TAG}"
