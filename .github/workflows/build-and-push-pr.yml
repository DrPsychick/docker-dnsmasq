# Build on every PR; push only on master
name: Build & Push

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/reusable-build.yml
    with:
      alpine_versions: '["3.24", "3.23", "latest", "3", "edge"]'
      # Push only when this is a real push to the master branch.
      # PR builds still run (build + version detection) but skip the push step.
      push_image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    secrets: inherit
