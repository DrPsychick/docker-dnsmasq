# Build on every PR; push only on master
name: Build & Push

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/reusable-build.yml
    with:
      alpine_versions: '["3.23", "latest", "3", "3.18", "3.19", "3.20", "edge"]'
